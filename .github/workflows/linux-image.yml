name: Linux container image

on:
  push:
    branches: [main, next]
    paths: ['linux/**', '.github/workflows/linux-image.yml']
  schedule:
    - cron: '17 3 * * 1'   # weekly: picks up new Alpine and Wine packages
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # main -> :latest; another branch (next) -> a tag of its own name, for testing
          if [ "$GITHUB_REF_NAME" = main ]; then echo "tag=latest" >> "$GITHUB_OUTPUT"; else echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v6
        with:
          context: linux
          file: linux/Containerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          build-args: |
            RV_IMAGE_REF=${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}
            RV_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
